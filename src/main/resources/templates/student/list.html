<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('学生档案')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('student')}"></nav>
<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">学生档案</h5>
        <a class="btn btn-primary btn-sm" th:href="@{/student/new}">＋ 新增学生</a>
    </div>
    <div class="card mb-3"><div class="card-body py-3">
        <form class="row g-2" method="get" th:action="@{/student}">
            <div class="col-auto">
                <input type="text" name="kw" class="form-control form-control-sm" placeholder="姓名 / 学号" th:value="${kw}">
            </div>
            <div class="col-auto">
                <select name="classId" class="form-select form-select-sm">
                    <option value="">全部班级</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id==classId}"></option>
                </select>
            </div>
            <div class="col-auto">
                <select name="status" class="form-select form-select-sm">
                    <option value="">全部状态</option>
                    <option th:each="s : ${ {'在读','休学','转班','毕业'} }" th:value="${s}" th:text="${s}" th:selected="${s==status}"></option>
                </select>
            </div>
            <div class="col-auto"><button class="btn btn-sm btn-secondary">查询</button></div>
        </form>
    </div></div>
    <div class="card"><div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead><tr>
                <th>学生</th><th>学号</th><th>班级</th><th>性别</th><th>出生日期</th>
                <th>家长 / 电话</th><th>状态</th><th>操作</th>
            </tr></thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td>
                    <span class="avatar" th:text="${s.photo}"></span>
                    <a class="ms-2 text-decoration-none fw-semibold" th:href="@{'/student/' + ${s.id}}" th:text="${s.name}"></a>
                </td>
                <td th:text="${s.studentNo}"></td>
                <td th:text="${s.className}"></td>
                <td th:text="${s.gender}"></td>
                <td th:text="${s.birthDate}"></td>
                <td th:text="${s.guardianName} + ' · ' + ${s.guardianPhone}"></td>
                <td>
                    <span class="badge" th:text="${s.status}"
                          th:classappend="${s.status=='在读'}?'bg-success':(${s.status=='休学'}?'bg-warning text-dark':'bg-secondary')"></span>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{'/student/' + ${s.id}}">档案</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{'/student/edit/' + ${s.id}}">编辑</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{'/student/delete/' + ${s.id}}"
                       onclick="return confirm('删除该生及其全部成绩/出勤/素质记录？')">删除</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="8" class="text-center text-muted py-4">暂无学生</td></tr>
            </tbody>
        </table>
    </div></div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
