<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('成绩管理')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('score')}"></nav>
<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">成绩管理</h5>
        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#examModal">＋ 新增考试批次</button>
    </div>
    <div class="card mb-3"><div class="card-body py-3">
        <form class="row g-2 align-items-center" method="get" th:action="@{/score}">
            <div class="col-auto"><label class="col-form-label-sm">考试</label></div>
            <div class="col-auto">
                <select name="examId" class="form-select form-select-sm">
                    <option th:each="e : ${exams}" th:value="${e.id}" th:text="${e.name}" th:selected="${e.id==examId}"></option>
                </select>
            </div>
            <div class="col-auto"><label class="col-form-label-sm">班级</label></div>
            <div class="col-auto">
                <select name="classId" class="form-select form-select-sm">
                    <option value="">全部班级</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id==classId}"></option>
                </select>
            </div>
            <div class="col-auto"><button class="btn btn-sm btn-secondary">查看成绩单</button></div>
            <div class="col-auto ms-2">
                <a class="btn btn-sm btn-success"
                   th:if="${examId != null}"
                   th:href="@{/score/input(examId=${examId}, classId=${classId == null ? 1 : classId}, subjectId=1)}">✎ 成绩录入</a>
            </div>
        </form>
    </div></div>
    <div class="card"><div class="card-body p-0" style="overflow-x:auto">
        <table class="table table-striped align-middle mb-0" style="min-width:900px">
            <thead><tr>
                <th>排名</th><th>学号</th><th>姓名</th><th>班级</th>
                <th th:each="s : ${examSubjects}" th:text="${s}"></th>
                <th class="text-danger">总分</th><th>平均分</th>
            </tr></thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td><span class="rank-badge" th:text="${r.classRank}"></span></td>
                <td th:text="${r.studentNo}"></td>
                <td><a class="text-decoration-none fw-semibold" th:href="@{'/student/' + ${r.studentId}}" th:text="${r.studentName}"></a></td>
                <td th:text="${r.className}"></td>
                <td th:each="s : ${examSubjects}">
                    <span th:if="${r.subjects.get(s) != null}" th:text="${r.subjects.get(s)}"></span>
                    <span th:unless="${r.subjects.get(s) != null}" class="text-muted">-</span>
                </td>
                <td class="fw-bold text-danger" th:text="${r.total}"></td>
                <td th:text="${r.avg}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td th:colspan="${8 + #lists.size(examSubjects)}"
                class="text-center text-muted py-4">该考试暂无成绩，请先录入</td></tr>
            </tbody>
        </table>
    </div></div>
</div>

<div class="modal fade" id="examModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <form th:action="@{/score/exam/save}" method="post">
            <div class="modal-header"><h5 class="modal-title">新增考试批次</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-2"><label class="form-label">考试名称</label>
                    <input name="name" class="form-control" required placeholder="如 高二上学期期中考试"></div>
                <div class="mb-2"><label class="form-label">考试日期</label>
                    <input type="date" name="examDate" class="form-control" required></div>
                <div class="mb-2"><label class="form-label">学期</label>
                    <input name="term" class="form-control" required placeholder="如 2025-2026学年第一学期"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary">保存</button></div>
        </form>
    </div></div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
