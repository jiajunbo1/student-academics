<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('成绩录入')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('score')}"></nav>
<div class="container py-4" style="max-width:760px">
    <h5 class="mb-3">成绩录入</h5>
    <div class="card mb-3"><div class="card-body py-3">
        <form class="row g-2 align-items-end" method="get" th:action="@{/score/input}">
            <div class="col-md-4"><label class="form-label small">考试</label>
                <select name="examId" class="form-select form-select-sm">
                    <option th:each="e : ${exams}" th:value="${e.id}" th:text="${e.name}" th:selected="${e.id==examId}"></option>
                </select></div>
            <div class="col-md-3"><label class="form-label small">班级</label>
                <select name="classId" class="form-select form-select-sm">
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id==classId}"></option>
                </select></div>
            <div class="col-md-3"><label class="form-label small">科目</label>
                <select name="subjectId" class="form-select form-select-sm">
                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id==subjectId}"></option>
                </select></div>
            <div class="col-md-2"><button class="btn btn-sm btn-secondary w-100">加载名单</button></div>
        </form>
    </div></div>
    <form th:action="@{/score/input}" method="post">
        <input type="hidden" name="examId" th:value="${examId}">
        <input type="hidden" name="subjectId" th:value="${subjectId}">
        <div class="card"><div class="card-body p-0">
            <table class="table align-middle mb-0">
                <thead><tr><th>学号</th><th>姓名</th><th style="width:200px">分数（0-150）</th></tr></thead>
                <tbody>
                <tr th:each="st : ${students}">
                    <td th:text="${st.studentNo}"></td>
                    <td class="fw-semibold" th:text="${st.name}"></td>
                    <td><input type="number" step="0.5" min="0" max="150" class="form-control form-control-sm"
                               th:name="'s' + ${st.id}" th:value="${existing.get(st.id)}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}"><td colspan="3" class="text-center text-muted py-4">该班暂无学生</td></tr>
                </tbody>
            </table>
        </div></div>
        <div class="mt-3">
            <button class="btn btn-success">保存成绩</button>
            <a class="btn btn-outline-secondary" th:href="@{/score(examId=${examId})}">返回成绩单</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
