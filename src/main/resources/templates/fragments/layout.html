<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - 学业管理系统'">学业管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<nav th:fragment="nav(active)" class="navbar navbar-expand-lg navbar-dark" style="background:#2c3e6b">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">📚 学业管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active=='dashboard'}?'active'" th:href="@{/}">首页看板</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active=='student'}?'active'" th:href="@{/student}">学生档案</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active=='clazz'}?'active'" th:href="@{/clazz}">班级管理</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active=='score'}?'active'" th:href="@{/score}">成绩管理</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active=='attendance'}?'active'" th:href="@{/attendance}">出勤管理</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active=='quality'}?'active'" th:href="@{/quality}">综合素质</a></li>
            </ul>
            <span class="navbar-text text-white" th:if="${session.loginTeacher != null}">
                <span th:text="${session.loginTeacher.realName}"></span>
                <span class="badge bg-info" th:if="${session.loginTeacher.subjectName}" th:text="${session.loginTeacher.subjectName}+'老师'"></span>
                <a class="btn btn-sm btn-outline-light ms-2" th:href="@{/logout}">退出</a>
            </span>
        </div>
    </div>
</nav>
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
