<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 学业管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h4 class="text-center mb-1 fw-bold">📚 学业管理系统</h4>
        <p class="text-center text-muted mb-4">高中教师学生资料管理平台</p>
        <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">教师账号</label>
                <input type="text" name="username" class="form-control" required th:value="${username}" placeholder="如 wang">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required placeholder="如 123456">
            </div>
            <button class="btn btn-primary w-100">登 录</button>
        </form>
        <p class="text-muted small mt-3 mb-0">演示账号：wang / li / zhang，密码均为 123456</p>
    </div>
</div>
</body>
</html>
