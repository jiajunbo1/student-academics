<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('出勤签到')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('attendance')}"></nav>
<div class="container py-4" style="max-width:820px">
    <h5 class="mb-3">班级签到</h5>
    <div class="card mb-3"><div class="card-body py-3">
        <form class="row g-2 align-items-end" method="get" th:action="@{/attendance/register}">
            <div class="col-md-4"><label class="form-label small">班级</label>
                <select name="classId" class="form-select form-select-sm">
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id==classId}"></option>
                </select></div>
            <div class="col-md-4"><label class="form-label small">日期</label>
                <input type="date" name="date" class="form-control form-control-sm" th:value="${date}"></div>
            <div class="col-md-2"><button class="btn btn-sm btn-secondary w-100">加载名单</button></div>
        </form>
    </div></div>
    <form th:action="@{/attendance/register}" method="post">
        <input type="hidden" name="classId" th:value="${classId}">
        <input type="hidden" name="date" th:value="${date}">
        <div class="card"><div class="card-body p-0">
            <table class="table align-middle mb-0">
                <thead><tr><th>学号</th><th>姓名</th><th style="width:180px">状态</th><th style="width:260px">备注</th></tr></thead>
                <tbody>
                <tr th:each="st : ${students}" th:with="old=${existing.get(st.id)}">
                    <td th:text="${st.studentNo}"></td>
                    <td class="fw-semibold" th:text="${st.name}"></td>
                    <td><select th:name="'st' + ${st.id}" class="form-select form-select-sm">
                        <option value="">未记录</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${old != null and old.status == s}"></option>
                    </select></td>
                    <td><input type="text" class="form-control form-control-sm" th:name="'rm' + ${st.id}"
                               th:value="${old != null} ? ${old.remark} : ''"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}"><td colspan="4" class="text-center text-muted py-4">该班暂无学生</td></tr>
                </tbody>
            </table>
        </div></div>
        <div class="mt-3">
            <button class="btn btn-success">保存签到</button>
            <a class="btn btn-outline-secondary" th:href="@{/attendance}">返回记录</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
