<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('出勤管理')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('attendance')}"></nav>
<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">出勤管理</h5>
        <a class="btn btn-primary btn-sm" th:href="@{/attendance/register(classId=1)}">✎ 今日签到</a>
    </div>
    <div class="card mb-3"><div class="card-body py-3">
        <form class="row g-2 align-items-center" method="get" th:action="@{/attendance}">
            <div class="col-auto"><label class="col-form-label-sm">日期</label></div>
            <div class="col-auto"><input type="date" name="date" class="form-control form-control-sm" th:value="${date}"></div>
            <div class="col-auto"><label class="col-form-label-sm">班级</label></div>
            <div class="col-auto">
                <select name="classId" class="form-select form-select-sm">
                    <option value="">全部班级</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id==classId}"></option>
                </select>
            </div>
            <div class="col-auto"><button class="btn btn-sm btn-secondary">查询</button></div>
        </form>
    </div></div>
    <div class="card"><div class="card-body p-0">
        <table class="table table-hover align-middle mb-0">
            <thead><tr><th>日期</th><th>班级</th><th>学生</th><th>状态</th><th>备注</th></tr></thead>
            <tbody>
            <tr th:each="a : ${records}">
                <td th:text="${a.attDate}"></td>
                <td th:text="${a.className}"></td>
                <td><a class="text-decoration-none fw-semibold" th:href="@{'/student/' + ${a.studentId}}" th:text="${a.studentName}"></a></td>
                <td><span class="badge" th:classappend="${a.status=='出勤'}?'bg-success':(${a.status=='缺勤'}?'bg-danger':'bg-warning text-dark')" th:text="${a.status}"></span></td>
                <td class="text-muted" th:text="${a.remark}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(records)}"><td colspan="5" class="text-center text-muted py-4">暂无出勤记录</td></tr>
            </tbody>
        </table>
    </div></div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
